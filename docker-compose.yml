services:
  mcp:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ["uv", "run", "python", "mcp_server.py"]
    env_file:
      - path: .env
        required: false
    environment:
      - MCP_TRANSPORT=streamable-http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8765
    ports:
      - "8765:8765"

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      - MCP_SERVER_URL=http://mcp:8765/mcp
    ports:
      - "8000:8000"
    depends_on:
      - mcp

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
